server:
  tomcat:
    mbeanregistry:
      enabled: true


spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_JDBC_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      auto-commit: false
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  #  elasticsearch:
  #    uris: http://localhost:9200

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      connect-timeout: 300ms
      timeout: 200ms

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create
    properties:
      jakarta.persistence.schema-generation.create-source: metadata
      jakarta.persistence.schema-generation.database.action: none
      jakarta.persistence.schema-generation.scripts.action: create
      jakarta.persistence.schema-generation.scripts.create-target: build/generated-schema.sql
      hibernate.format_sql: false
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  kakao:
    client:
      id: ${REST_API_KAKAO}
      secret: ${CLIENT_SECRET_KAKAO}
    redirect:
      uri: ${REDIRECT_URI_KAKAO}

  naver:
    client:
      id: ${CLIENT_ID_NAVER}
      secret: ${CLIENT_SECRET_NAVER}
    redirect:
      uri: ${REDIRECT_URI_NAVER}

  google:
    client:
      id: ${CLIENT_ID_GOOGLE}
      secret: ${CLIENT_SECRET_GOOGLE}
    redirect:
      uri: ${REDIRECT_URI_GOOGLE}

  toss:
    secretkey: ${SECRETKEY_TOSS}

logging:
  level:
    org.hibernate.orm.jdbc.bind: off
    org.hibernate.orm.jdbc.extract: off
    org.springframework.transaction.interceptor: off
    com.backend: DEBUG
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL}
  config: classpath:logback.xml

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

custom:
  jwt:
    expireSecondsAccessToken: 3600 # 1시간
    expireSecondsRefreshToken: 604800 # 7일
    secretPattern: ${SECRET_PATTERN}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  seed:
    enabled: false   # 기본은 false
    reset: false     # true면 전체 삭제 후 재삽입
    marker-email: seed_admin@windfall.local

aws:
  s3:
    accessKey: ${S3_ACCESS_KEY}
    secretKey: ${S3_SECRET_KEY}
    bucketName: ${BUCKET_NAME}
    baseUrl: ${S3_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false # 헬스체크 최소화

resilience4j:
  retry:
    configs:
      customRetry:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponential-backoff-multiplier: 2.0
  circuitbreaker:
    configs:
      redisCacheDefault:
        slidingWindowType: COUNT_BASED # 최근 호출 기준으로 통계 계산
        slidingWindowSize: 20 # 최근 20개의 호출을 기준으로 둠
        minimumNumberOfCalls: 10 # 비율 계산을 시작하기 위한 최소 표본 수

        failureRateThreshold: 50 # 실패율이 넘어갈 경우 OPEN 상태로 전환

        slowCallDurationThreshold: 100ms # 써킷 브레이커 AOP를 적용한 로직이 특정 지연시간을 넘어갔을 경우 slowCall로 기록
        slowCallRateThreshold: 50 # slowCall비율이 일정 이상 넘어갈 경우 OPEN 상태로 전환

        waitDurationInOpenState: 10s # OPEN 지속시간, 후속 요청이 Half-Open을 유발
        permittedNumberOfCallsInHalfOpenState: 3 # Close를 위한 Half-Open 시도 수

        recordExceptions:
          - org.springframework.dao.DataAccessException # 실패를 수집하기 위한 에러 설정

    instances:
      sellerCache:
        baseConfig: redisCacheDefault